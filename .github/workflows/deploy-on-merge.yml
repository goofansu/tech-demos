name: Deploy merged pull requests

on:
  pull_request:
    types: [closed]

concurrency:
  group: tech-demos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, linux, x64, tech-demos]
    timeout-minutes: 10
    steps:
      - name: Deploy current app
        run: sudo -n systemctl start tech-demos-autodeploy.service
