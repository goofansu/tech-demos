<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A step-by-step primer on a Jev request and reply. Noul, Choice, and Score, asked about fruit, with live answers."
    />
    <title>Fruit primer · How a Jev request works</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="skip" href="#caption">Skip to the lesson</a>
    <header class="top">
      <div class="titles">
        <p class="brand">Fruit primer</p>
        <h1>How a Jev request works</h1>
        <p class="lede" id="lede"></p>
      </div>
      <nav id="nav" aria-label="Question types"></nav>
    </header>
    <p id="status" class="status" role="status" hidden></p>
    <p id="missing" class="missing" hidden></p>
    <main class="stage" id="stage">
      <section class="card" id="fruit-card" aria-labelledby="fruit-label">
        <h2 id="fruit-label">The fruit</h2>
        <div id="fruit"></div>
      </section>
      <section class="card" aria-labelledby="req-label">
        <header class="card-head">
          <h2 id="req-label">Request</h2>
          <p class="card-note">
            <span class="dot" id="send-dot" hidden></span>
            <span id="req-note-text"></span>
          </p>
        </header>
        <div id="request" class="doc"></div>
      </section>
      <section class="card" aria-labelledby="res-label">
        <header class="card-head">
          <h2 id="res-label">Response</h2>
          <p class="card-note" id="res-note-text"></p>
        </header>
        <div id="response" class="doc"></div>
        <div id="scale" class="scale-track" hidden>
          <div class="track" aria-hidden="true">
            <div class="fill" id="scale-fill"></div>
          </div>
          <div class="scale-labels" id="scale-labels"></div>
          <p class="scale-value" id="scale-value"></p>
        </div>
        <div id="weights" class="weights" hidden></div>
        <div id="bars" class="bars" hidden></div>
        <div id="meter" class="meter" hidden>
          <div class="meter-bar">
            <div class="track" aria-hidden="true">
              <div class="fill" id="meter-fill"></div>
            </div>
            <div class="mark" id="meter-mark" hidden></div>
          </div>
          <div class="scale" aria-hidden="true">
            <span>0 no</span>
            <span>0.5 cannot tell</span>
            <span>1 yes</span>
          </div>
          <p class="meter-value" id="meter-value"></p>
        </div>
      </section>
    </main>
    <section class="caption" id="caption" aria-live="polite">
      <div class="ticks" id="ticks" role="group" aria-label="Lesson steps"></div>
      <p class="eyebrow" id="step-label"></p>
      <h2 id="cap-title"></h2>
      <p id="cap-body"></p>
      <div class="transport">
        <button type="button" id="prev">Previous</button>
        <button type="button" id="play" aria-pressed="false">Play</button>
        <button type="button" id="next">Next</button>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
